spring.application.name=product-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/product_db
spring.datasource.username=root
spring.datasource.password=sanjay

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log file name
logging.file.name=logs/product-service.log

# Log level
logging.level.root=INFO
logging.level.com.ecommerce.productservice=DEBUG

# Log pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} [%file:%line] - %msg%n

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true

jwt.secret=MyVerySecretKeyForJwtGeneration12345678901234567890

logging.level.org.springframework.security=TRACE


resilience4j.circuitbreaker.instances.userService.register-health-indicator=true
resilience4j.circuitbreaker.instances.userService.sliding-window-size=5
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.userService.automatic-transition-from-open-to-half-open-enabled=true


# Retry
###############

resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=2s
resilience4j.retry.instances.userService.retry-exceptions=feign.RetryableException,feign.FeignException
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.aop=DEBUG


app.message=Product Service Updated Successfully

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true


